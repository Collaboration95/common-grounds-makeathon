<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wes Waldo</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="wall" aria-label="All the worlds">
    <div id="worlds"></div>
    <header class="wall-head">
      <h1>Wes Waldo</h1>
      <p>Every world hides someone who doesn't belong. Pick a world.</p>
    </header>
    <p id="wall-empty" hidden>No worlds yet. Hide someone to paint the first one.</p>
    <button id="create-btn" class="btn primary">Hide someone</button>
  </main>

  <section id="game" hidden>
    <div id="stage">
      <img id="bg" alt="">
      <div id="sprites"></div>
      <div id="hint-box" hidden></div>
      <div id="loupe" hidden></div>
    </div>
    <aside id="target-card">
      <span>Find</span>
      <div id="target-portrait"></div>
      <strong id="target-name"></strong>
    </aside>
    <nav class="game-controls">
      <button id="back-btn" class="btn">← All worlds</button>
      <button id="hint-btn" class="btn">Need a clue?</button>
      <button id="loupe-btn" class="btn" aria-pressed="true" title="Magnifying glass (M)">🔍 On</button>
      <p id="hint-text" role="status" hidden></p>
    </nav>
    <div id="found" hidden>
      <h2 id="found-title"></h2>
      <p id="found-story"></p>
      <div class="row">
        <button id="replay-btn" class="btn">Play again</button>
        <button id="found-create-btn" class="btn primary">Hide someone else</button>
        <button id="found-back-btn" class="btn">All worlds</button>
      </div>
    </div>
  </section>

  <dialog id="create">
    <form id="create-form">
      <h2>Hide someone</h2>
      <label>The moment
        <textarea name="moment" rows="2" required placeholder="The Quidditch World Cup final, seconds before the Snitch is caught"></textarea>
      </label>
      <label>Who's hiding in it?
        <input name="guest" required placeholder="Severus Snape, deeply unimpressed">
      </label>
      <p id="job-status" role="status"></p>
      <div class="row">
        <button type="button" id="surprise-btn" class="btn">Surprise me</button>
        <button type="button" id="cancel-btn" class="btn">Cancel</button>
        <button type="submit" id="make-btn" class="btn primary">Paint it</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
