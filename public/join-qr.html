<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Join The Commons</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body.joinqr { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1d1424; font-family: inherit; }
    .card { background: #fbf3e2; color: #3b2414; border: 3px solid #6b4a2b; border-radius: 22px; padding: 4vh 5vh; text-align: center;
      box-shadow: 0 20px 60px #0008; transform: rotate(-1deg); }
    .card h1 { margin: 0 0 1vh; font-size: 5vh; }
    .card p { margin: 1vh 0 0; font-size: 2.6vh; opacity: .8; }
    .card img { width: min(62vh, 80vw); height: auto; display: block; margin: 2vh auto; image-rendering: pixelated; }
    .card #u { font: 600 2.4vh var(--mono, monospace); word-break: break-all; color: inherit; }
    .card .go { display: inline-block; margin: 2.4vh 0 .4vh; background: #e0694b; color: #fff8e6; border: 3px solid #3a2416; border-radius: 14px; padding: 1.4vh 3vh; font-size: 3vh; font-weight: 800; text-decoration: none; box-shadow: 0 4px 0 rgba(58,36,22,.6); }
  </style>
</head>
<body class="joinqr">
  <div class="card">
    <h1>Add one thing to the Commons</h1>
    <p>wish or pick a character · watch it walk into the room</p>
    <a class="go" href="/wish">Add yours in this browser &rarr;</a>
    <p>or scan with your phone</p>
    <img src="/qr.svg" alt="QR code to join">
    <a id="u" href="/wish"></a>
  </div>
  <script>document.getElementById('u').textContent = location.origin + '/wish';</script>
  <script src="/pill.js"></script>
</body>
</html>
